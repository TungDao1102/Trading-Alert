# Paper freeze monitor — hourly soak-host cron (Phase 7, plan 07-04).
#
# Per D-04: the soak pins its registry version at start and re-reads
# the registry on every monitor tick. A diff against the pinned set
# halts the stream's evidence claim and opens a new epoch. The diff
# log (logs/paper/registry_diff.jsonl) is the PAPER-03 acceptance
# artifact.
#
# This workflow is the scheduled CI invoker (hourly). It calls the
# freeze check CLI with the diff-log path. The CLI loads the pinned
# state from logs/paper/pinned_epoch.json (operator-managed) and
# appends one JSONL line per tick. On rollover the CLI writes a new
# pinned-state file; the next tick starts again from the committed pin
# (plan 16-47, decision Q-F), so a rollover stays visible every tick
# until the user commits the new pin.
#
# Operator alternative: a soak-host scheduled process (cron, systemd
# timer, etc.) calling the same CLI. Either satisfies D-04; CI is
# cheaper, a process is more immediate.
#
# Plan 16-09 (L-01, D-21): the CLI runs with --from-allowlist, so no
# strategy or parameter-set id is written here. It checks the one set
# the paper-start allowlist authorizes and appends a SKIPPED line while
# that allowlist is empty (SKIPPED is neither clean nor a failure). Every
# line is stamped with the run id, run attempt, event name, cron string
# (PAPER_EVENT_SCHEDULE) and commit, so a reconciler can tell scheduled
# ticks from manual runs.
#
# What this check proves, and what it does not (D-22, L-01): it proves
# registry immutability for the checked set, nothing more. It never
# proves that the paper host ran, that the feed was healthy or that any
# bar was evaluated. A scheduled run that did not happen writes no line;
# that gap is detected outside this workflow and is an EVIDENCE_GAP,
# never a clean tick.
#
# Where the pinned epoch comes from (plan 16-47, decision Q-F
# commit-pinned-state, decisions/16-DEC-Q-F.md): the file the user
# commits to master at evidence/paper/pinned_epoch.json after each pin.
# The step "Use the committed pinned epoch" copies it into logs/paper
# before the check; no credential or secret is involved. With no
# committed file there is no pin (a cached copy is removed). The Actions
# cache keeps only the diff log between ticks: it is operational state,
# not evidence (caches unused for 7 days are removed).

name: Paper Freeze Check

on:
  schedule:
    # Hourly at minute 34: the user's recorded choice (decisions/16-DEC-Q-Q.md,
    # plan 16-47). A minute off the top of the hour is a mitigation of unproven
    # effect on delayed or dropped scheduled runs (G15, REV-18); a missing tick
    # is still an EVIDENCE_GAP.
    - cron: "34 * * * *"
  workflow_dispatch: {}

# Least privilege (review WR-08): a read-only GITHUB_TOKEN, regardless of the repository default,
# and checkout does not persist it into .git/config.
permissions:
  contents: read

# Plan 16-59 (B2-WR-05; owner decisions 16-DEC-FREEZE-LOG-ASSEMBLY, Q2 = B, and the queue
# amendment of 16-DEC-FIXPLANS): two runs never overlap, because each run restores the newest
# cache and saves under its own key, and an overlap would hand the next run a log without the
# line of the other. `queue: max` keeps up to 100 pending runs instead of replacing the pending
# one; it is invalid together with a true `cancel-in-progress`, which must stay false. GitHub
# documents these keys (docs/SOURCES.md, read 2026-10-16, not verified live): the first live run
# proves the key is accepted. A run that is still cancelled or dropped is never inferred clean:
# the exporter merges every run artifact and records each missing tick (RUNBOOK 20.7).
concurrency:
  group: paper-freeze-check
  cancel-in-progress: false
  queue: max

jobs:
  freeze-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"

      - name: Sync dependencies
        run: uv sync --frozen

      # CR-06: the runner is ephemeral and logs/ is gitignored, so the
      # pinned state and the diff-log artifact must be persisted outside
      # the checkout — restore the state cache before the tick, save it
      # after, and always upload the diff log (the PAPER-03 acceptance
      # artifact). Without this every hourly run starts with no pinned
      # state (exit 2) and proves nothing.
      - name: Restore freeze state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: logs/paper
          key: paper-freeze-state
          restore-keys: |
            paper-freeze-

      # Q-F (commit-pinned-state): the pinned epoch is the file the user
      # committed to master, not whatever the cache restored. Copied, never
      # printed. Absent file: no pin (SKIPPED needs none; a non-empty
      # allowlist then fails loudly with exit code 2).
      - name: Use the committed pinned epoch
        env:
          COMMITTED_PIN: ${{ github.workspace }}/evidence/paper/pinned_epoch.json
          PAPER_PINNED_STATE: ${{ github.workspace }}/logs/paper/pinned_epoch.json
        run: |
          mkdir -p "$(dirname "$PAPER_PINNED_STATE")"
          if [ -f "$COMMITTED_PIN" ]; then
            cp -- "$COMMITTED_PIN" "$PAPER_PINNED_STATE"
          else
            rm -f -- "$PAPER_PINNED_STATE"
            echo "::notice::no committed pinned epoch (evidence/paper/pinned_epoch.json)"
          fi

      - name: Run freeze check
        id: freeze
        env:
          PAPER_REGISTRY_ROOT: ${{ github.workspace }}/params
          PAPER_PINNED_STATE: ${{ github.workspace }}/logs/paper/pinned_epoch.json
          PAPER_DIFF_LOG: ${{ github.workspace }}/logs/paper/registry_diff.jsonl
          # Empty on workflow_dispatch; the cron string on a scheduled run.
          PAPER_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          mkdir -p "$(dirname "$PAPER_DIFF_LOG")"
          set +e
          uv run python -m src.paper.freeze \
            --check \
            --from-allowlist \
            --diff-log "$PAPER_DIFF_LOG" \
            --pinned-state "$PAPER_PINNED_STATE" \
            --registry-root "$PAPER_REGISTRY_ROOT"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diff log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-diff-${{ github.run_id }}
          path: logs/paper/registry_diff.jsonl
          if-no-files-found: warn

      - name: Save freeze state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: logs/paper
          key: paper-freeze-${{ github.run_id }}

      # CR-06: run_check_cli returns 3 on a REGISTRY_DIFF rollover —
      # fail the workflow loudly instead of reporting green.
      - name: Alert on registry rollover
        if: steps.freeze.outputs.exit_code == '3'
        run: |
          echo "::error::REGISTRY_DIFF rollover detected — evidence claim halted, new epoch opened. See the registry-diff artifact."
          exit 1

      - name: Fail on check errors
        if: steps.freeze.outputs.exit_code != '0' && steps.freeze.outputs.exit_code != '3'
        run: |
          echo "::error::Freeze check exited with code ${{ steps.freeze.outputs.exit_code }} (2 = missing pinned state, 1 = error)."
          exit 1
