name: registry-gate

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  registry-gate:
    name: registry-gate (D-05)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the phase-11 negative tests read pre-change text via
          # `git show <baseline>:<file>` and would silently skip in a shallow clone.
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Re-hash registry (params TOML files must match pinned hashes)
        id: rehash
        run: |
          set -eu
          # Every params/**/*.toml file is verified against the pinned
          # hashes in tests/fixtures/phase4/parameters.json via
          # verify_parameter_set (D-04/D-05 tripwire). Comparing two
          # live loads against each other is vacuous — the gate must
          # compare against the recorded pins. TOML files with no pin
          # fail closed: register them before merging.
          # NOTE: phase3/parameters.json is legacy single-pin harness-only;
          # the gate uses the phase4 multi-set pin list.
          mapfile -t TOMLS < <(find params -name '*.toml' -not -path '*/node_modules/*' 2>/dev/null || true)
          if [ "${#TOMLS[@]}" -eq 0 ]; then
            echo "Re-hash: no params TOML files present; passes vacuously."
            exit 0
          fi
          uv run python - <<'PYEOF'
          import json
          import sys
          from pathlib import Path
          from src.domain.registry import verify_parameter_set
          pinned_doc = json.loads(
              Path("tests/fixtures/phase4/parameters.json").read_text()
          )
          # Canonical shape: {"parameter_sets": [...]}. Accept legacy
          # single-object {"strategy_id": ...} for robustness.
          if "parameter_sets" in pinned_doc:
              entries = pinned_doc["parameter_sets"]
          else:
              entries = [pinned_doc]
          pinned_sets = {
              (e["strategy_id"], e["parameter_set_id"]): e[
                  "parameter_set_hash"
              ]
              for e in entries
          }
          failures = []
          for toml_path in sorted(Path("params").rglob("*.toml")):
              parts = toml_path.parts
              key = (parts[1], toml_path.stem)
              if key not in pinned_sets:
                  failures.append(f"{toml_path}: no pinned hash — register it")
                  continue
              try:
                  verify_parameter_set(toml_path, pinned_sets[key])
              except Exception as exc:
                  failures.append(f"{toml_path}: pinned verify failed: {exc!r}")
          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(1)
          print(f"Re-hash passed: {len(list(Path('params').rglob('*.toml')))} TOML file(s) match pins.")
          PYEOF

      - name: Decision alignment gates (D-17, read-only)
        id: alignment
        run: |
          set -eu
          uv run python scripts/verify_decision_alignment.py all

      - name: Registry negative tests (fail-closed gates must hold)
        id: negative
        run: |
          set -eu
          uv run pytest tests/test_registry_gate.py tests/test_registry.py tests/test_kill_gate_docs.py tests/test_kill_gate_clock.py tests/test_research_gate_negative.py tests/test_decision_alignment*.py -q
