# Alembic config — Phase 2 Data Foundation
# Per PATTERNS §4 + RESEARCH §alternatives:
#  - script_location points at src/db/alembic (one Base, multiple migration dirs)
#  - sqlalchemy.url is overridden at runtime in env.py from $DATABASE_URL
#  - file_template keeps slugs sortable
#
# DATABASE_URL convention (from .env.example):
#   postgresql+psycopg://USER:PASS@HOST:5432/trading

[alembic]
script_location = src/db/alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40
revision_environment = false
sourceless = false

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
