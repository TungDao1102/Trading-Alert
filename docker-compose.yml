# Compose stack — Phase 2 Data Foundation
# Per D-04/D-05/D-12 + PATTERNS.md §2-3:
#  - postgres:17-bookworm with named volume; credentials from env only (T-02-02).
#  - app image built from Dockerfile (above); entrypoint overridden per service
#    (collector long-running, backup one-shot).
#  - raw Parquet data dir mounted as a named volume so dev-machine restarts
#    don't blow away the immutable raw store.

services:
  postgres:
    image: postgres:17-bookworm
    container_name: trading-alert-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-alert-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Compose hostname (overrides POSTGRES_HOST=localhost from .env)
      POSTGRES_HOST: postgres
    volumes:
      - rawdata:/app/data/raw
      # The backup bundle must survive container restarts — without this
      # mount, "off-host" bundles live on the ephemeral container FS.
      - backupdata:/app/data/backup
    # Phase 2 entrypoint is the OI/funding collector (5-min poll per D-07).
    # Backup drill runs as a one-shot Compose target (see scripts/backup-drill.ps1).
    command: ["uv", "run", "python", "-m", "src.data.collector"]

volumes:
  pgdata:
  rawdata:
  backupdata:
