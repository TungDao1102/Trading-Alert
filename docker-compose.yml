# Compose stack (13.1, D-05 to D-09). One file, one image, different commands.
#
#  - Project name is fixed to `trading`, so named volumes are trading_pgdata etc. Override
#    with `-p` to run a second, isolated environment from the same checkout (cutover tests).
#  - postgres publishes on loopback only (F-709); it is reachable from other hosts only
#    through an SSH tunnel. Docker bypasses ufw, so the bind address is the control.
#  - Data lives only in named volumes (pgdata, rawdata, backupdata, logs); no host bind mounts.
#  - Secrets come only from env_file (.env, mode 0600, gitignored). TRADING_ENV_FILE selects
#    another file. `${VAR:?}` checks exist only on the always-on postgres vars: profile-gated
#    services are still interpolated, so a required-variable check there would break every
#    compose command for operators who have not configured backups or live.
#  - Per-service secrets (plan 24-30, D-29, WR-06): the `live` service reads its OWN env file
#    (`${TRADING_LIVE_ENV_FILE:-.env.live}`, mode 0600, gitignored, `required: false` so every
#    other compose command works without it) and NOT the shared one. The Binance credential names
#    and the live Telegram bot names live only there; the collector, db-upgrade and paper services
#    never receive a `BINANCE_` name. The closed per-service variable lists are written in
#    tests/test_live_compose_env_split.py and checked against `docker compose config`; plan 24-36
#    splits the paper Telegram and backup names the same way.
#  - No container_name anywhere (two projects on one daemon must not collide).

name: trading

x-app: &app
  image: trading-alert:${IMAGE_TAG:-dev}
  env_file: ${TRADING_ENV_FILE:-.env}
  restart: unless-stopped
  # tini as PID 1: Python as PID 1 gets no default SIGTERM handling, so a stop would wait
  # out the grace period and then SIGKILL.
  init: true
  stop_grace_period: 30s
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-database-env: &database-env
  # Compose hostname (overrides POSTGRES_HOST=localhost from .env).
  POSTGRES_HOST: postgres
  # In-network DB URL built from the same vars as the postgres service. The port is the
  # container port (literal 5432), never the host-published ${POSTGRES_PORT}: the published
  # port only exists on the host, and a non-default value would break the collector.
  # Passwords must stay URL-safe.
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER required in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}@postgres:5432/${POSTGRES_DB:-trading}

services:
  postgres:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  # One-shot schema migration. Nothing else creates tables, so a fresh host needs this
  # before the collector starts. It owns the image build; the other app services reuse
  # the tag so one `compose build` produces one image.
  db-upgrade:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      # Build-time revision stamp (OPS-04, D-31): deploy/update.sh and deploy/soak-image.sh export
      # the checked-out commit; an unset variable stays empty and the image answers `unknown`.
      args:
        TRADING_APP_REVISION: ${TRADING_APP_REVISION:-}
    restart: "no"
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    environment: *database-env
    depends_on:
      postgres:
        condition: service_healthy
    # Short-lived: the image HEALTHCHECK probes the collector and would report unhealthy.
    healthcheck:
      disable: true

  # OI/funding collector (5-min poll per D-07). The probe repeats the image HEALTHCHECK
  # explicitly so this service's contract does not depend on image metadata. Nothing
  # depends on the collector being healthy: there is no watermark until the first tick.
  collector:
    <<: *app
    environment: *database-env
    depends_on:
      db-upgrade:
        condition: service_completed_successfully
    volumes:
      - rawdata:/app/data/raw
      - logs:/app/logs
    command: ["/app/.venv/bin/python", "-m", "src.data.collector"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "src.data.collector", "--healthcheck"]
      interval: 60s
      timeout: 15s
      start_period: 6m
      retries: 3

  # Paper runtime (Phase 16, D-01, D-32): `python -m src.paper.runtime` with its own probe, which
  # reports healthy only while the last processed closed bar is younger than the ratified age.
  # Interval, timeout, start period and retries copy the collector's. The probe feeds no
  # evidence criterion: coverage is computed from records.
  #  - restart `unless-stopped`: the owner's decision 16-DEC-RESTART-POLICY (16-55 Q1 = A).
  #    `on-failure` was dropped because it does not restart a container after a daemon restart
  #    (Docker documentation, docs/SOURCES.md), so a host reboot or a daemon restart could leave
  #    the runtime down past the 900 s uncovered ceiling. `unless-stopped` comes back after a
  #    reboot, a daemon restart and a crash (exit 1 or 7, a CRASH gap), and stays down only after
  #    a requested `deploy/compose-soak.sh stop paper`. No restart cap: a cap of N would stop the
  #    runtime for good after N quick crashes during a short database outage.
  #  - `unless-stopped` restarts every exit no stop preceded, an exit 0 included, and Compose
  #    cannot exclude codes. So no path of this command relies on exit 0 to stay down: with
  #    `--hold-on-refusal` a refusal and SKIPPED (an empty allowlist) hold instead of exiting.
  #    The refusal codes are 3 (trade-capable variable), 4 (configuration not ratified), 5 (no
  #    pinned epoch), 6 (admission or epoch mismatch) and 8 (another runtime holds the instance
  #    lease, plan 16-55). A hold writes no record, starts no loop and leaves the held marker of
  #    its container, so the probe reports it unhealthy; it exits with its code only when stopped.
  #  - This command never passes `--pin-epoch`: the pin exits 0, which this policy would restart.
  #    The pin is the one-shot `paper-pin` service below (16-DEC-PIN-COMMAND).
  #  - logs holds logs/paper/pinned_epoch.json and registry_diff.jsonl.
  #  - WR-06 (per-service env_file split), first half done in plan 24-30: the Binance names are
  #    in the live service's own file, so this container receives none. It still shares the base
  #    env_file with the collector, so it also sees any BACKUP_ variable in it until plan 24-36.
  #    The runtime refuses any BINANCE_ name at start as the second barrier. The soak runs as its
  #    own project
  #    (`deploy/compose-soak.sh`, project trading-soak, own pgdata volume).
  paper:
    <<: *app
    profiles: ["paper"]
    restart: "unless-stopped"
    environment: *database-env
    depends_on:
      db-upgrade:
        condition: service_completed_successfully
    volumes:
      - logs:/app/logs
    command: ["/app/.venv/bin/python", "-m", "src.paper.runtime", "--hold-on-refusal"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "src.paper.runtime", "--healthcheck"]
      interval: 60s
      timeout: 15s
      start_period: 6m
      retries: 3

  # One-shot epoch pin (plan 16-55, 16-DEC-PIN-COMMAND): same image, environment and logs volume
  # as `paper`, its own profile, `restart: "no"`, so Docker never restarts the pin process. It takes
  # the instance lease, records EPOCH_PINNED, writes logs/paper/pinned_epoch.json and exits 0
  # without starting the loop. Run it with `deploy/compose-soak.sh --profile paper-pin run --rm
  # paper-pin`, then start the managed `paper` service at once (RUNBOOK 20.1). No probe: a
  # one-shot has nothing to report.
  paper-pin:
    <<: *app
    profiles: ["paper-pin"]
    restart: "no"
    environment: *database-env
    depends_on:
      db-upgrade:
        condition: service_completed_successfully
    volumes:
      - logs:/app/logs
    command: ["/app/.venv/bin/python", "-m", "src.paper.runtime", "--pin-epoch"]
    healthcheck:
      disable: true

  # Live runner placeholder, never part of the default stack. No entrypoint yet: Phase 24
  # (live) replaces this command and defines the service probe (D-06). Live credentials use
  # separate variable names (OPS-06) in the live service's own env file (plan 24-30, D-29): the
  # `env_file` below REPLACES the shared one of the x-app anchor, so nothing in `.env` (the shadow
  # bot token, BACKUP_ names, the paper names) reaches this container; only the database values
  # of x-database-env are added. Nothing is interpolated except the file name.
  live:
    <<: *app
    env_file:
      - path: ${TRADING_LIVE_ENV_FILE:-.env.live}
        required: false
    environment: *database-env
    profiles: ["live"]
    restart: "no"
    command:
      - /app/.venv/bin/python
      - -c
      - "raise SystemExit('live runner not implemented yet: arrives in Phase 24')"
    healthcheck:
      disable: true

  # Scheduled backup (ops profile). Owns the ops image build (runtime + pg client 17, rclone,
  # rsync, ssh). The CLI is implemented by plans 06 and 08. BACKUP_S3_* and BACKUP_CRYPT_*
  # arrive only through env_file, never through interpolation, so operators without backup
  # config can still run every compose command; validation is fail-closed inside Python.
  # rawdata is read-only here: the backup must never be able to modify the raw store.
  backup:
    <<: *app
    image: trading-alert-ops:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile
      target: ops
      args:
        TRADING_APP_REVISION: ${TRADING_APP_REVISION:-}
    profiles: ["ops"]
    restart: "no"
    command: ["/app/.venv/bin/python", "-m", "src.ops.backup", "scheduled"]
    environment: *database-env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: volume
        source: rawdata
        target: /app/data/raw
        read_only: true
      - backupdata:/app/data/backup
    healthcheck:
      disable: true

  # Toolbox for deploy/*.sh (restore, drill, cutover): same ops image, explicit commands
  # supplied by the scripts. The default command only prints the backup CLI help.
  ops:
    <<: *app
    image: trading-alert-ops:${IMAGE_TAG:-dev}
    profiles: ["ops"]
    restart: "no"
    command: ["/app/.venv/bin/python", "-m", "src.ops.backup", "--help"]
    environment: *database-env
    volumes:
      - rawdata:/app/data/raw
      - backupdata:/app/data/backup
      - logs:/app/logs
    healthcheck:
      disable: true

volumes:
  pgdata:
  rawdata:
  backupdata:
  logs:
