# params/range-mr/baseline-v1.toml
#
# Baseline parameter set for the range-mr strategy (Phase 4, plan 04-03).
#
# Per D-04: this file is the source of truth for the parameter set.
# Once referenced by a backtest/alert/order plan, its hash is permanent.
# Do not mutate — create a new parameter set + bump strategy version.
#
# Per D-05: Family C (range-mr) extends the Phase-3 STRATEGY_KEYS
# whitelist with zone_min_touches, zone_aging_bars, range_break_buffer_atr,
# regime_filter_lookback. Per D-06: strategy-semantic parameters live
# ONLY in the registry. Runtime config (endpoints, tokens, DB refs, log
# levels, poll intervals) lives in env/secret stores and must never
# silently alter strategy semantics.

schema_version = 1

[strategy]
strategy_id = "range-mr"
strategy_version = "v1.0.0"

[parameters]
# Shared keys (copied from trend-pullback/baseline-v1 at tracer values).
swing_lookback = 20
zone_tolerance_atr = 0.5
breakout_confirmation_bars = 3
entry_buffer_atr = 0.1
sl_buffer_atr = 0.2
minimum_rr = 2.0
signal_expiry_hours = 4
risk_rate = 0.005
# RESERVED (review WR-10): minimum_risk_utilization_after_rounding has no
# reader in src/ — no utilization gate exists yet. Wiring belongs to the
# Phase 5 risk/quantization work. Do not assume an active gate.
minimum_risk_utilization_after_rounding = 0.6
# Family C keys (added in plan 04-03, D-05).
zone_min_touches = 2
zone_aging_bars = 50
range_break_buffer_atr = 0.2
# RESERVED (review WR-10): regime_filter_lookback has no reader in src/ —
# no lookback gate exists yet. Wiring belongs to a future family-C
# refinement phase. Do not assume an active gate.
regime_filter_lookback = 50
# Detector volatility knobs (Phase 04 review fix CR-01): the ATR period
# the Family C detector sizes its touch band and break buffer with, and
# the touch-tolerance band around each range edge. Previously silent
# code defaults; now versioned parameters.
atr_period = 14
touch_tolerance_atr = 0.3
